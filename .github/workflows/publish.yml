name: publish

on:
  schedule:
    - cron: '7 * * * *' # 매시 7분 (정각 혼잡 회피). GitHub 예약 실행은 수십 분 늦거나 건너뛰어질 수 있음
  workflow_dispatch:
    inputs:
      fb_test:
        description: '테스트: 글 생성 없이 가장 최근 글 1개를 페이스북에 게시 (이미 올린 글이면 건너뜀)'
        type: boolean
        default: false
      force:
        description: '이미 올린 글이어도 다시 게시 (중복 게시물이 생김)'
        type: boolean
        default: false
      reel_preview:
        description: '미리보기: 가장 최근 글로 숏폼 영상만 만들어 다운로드용 파일로 저장 (게시 안 함)'
        type: boolean
        default: false
      kr_only:
        description: 'K-บันเทิง 후보만으로 글 생성 (테스트용)'
        type: boolean
        default: false
      max_per_day:
        description: '이번 실행만 하루 한도 덮어쓰기 (예: 999 = 한도 무시)'
        type: string
        default: ''
  push:
    branches: [main]
    paths-ignore: ['content/**', 'public/thumbs/**', '**.md']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
  NEXT_PUBLIC_SITE_NAME: ${{ vars.SITE_NAME }}
  NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  NEXT_PUBLIC_ADSENSE_ID: ${{ vars.ADSENSE_ID }}
  NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
  NEXT_PUBLIC_ADSENSE_SLOT_SIDE: ${{ vars.ADSENSE_SLOT_SIDE }}
  NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
  NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}
  NEXT_PUBLIC_SHOPEE_AFFILIATE_ID: ${{ vars.SHOPEE_AFFILIATE_ID }}
  NEXT_PUBLIC_YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
  NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.FACEBOOK_URL }}
  NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.INSTAGRAM_URL }}
  NEXT_PUBLIC_THREADS_URL: ${{ vars.THREADS_URL }}
  NEXT_PUBLIC_TIKTOK_URL: ${{ vars.TIKTOK_URL }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  FB_FORCE: ${{ inputs.force }}
  THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  run:
    runs-on: ubuntu-24.04 # 2026-10-19 부터 ubuntu-latest 가 26 으로 바뀜 → 네이티브 의존성(sharp/resvg) 안정성을 위해 고정
    timeout-minutes: 55 # 영상 렌더+TTS+FB/IG 처리 대기가 글당 몇 분씩 걸릴 수 있음
    steps:
      # 재실행/대기열 실행도 항상 최신 main 기준 (예전 커밋으로 돌면 방금 올라간 글을 못 봐서 중복 발행)
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 스크립트 문법 오류를 글 생성 전에 잡음 (import 된 모듈까지 로드 확인)
      - name: Check scripts
        run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f" || exit 1; done

      # 폰트/거절목록/모델 쿨다운 캐시. 저장은 아래에서 if: always() 로 (실패한 실행에서도 기록이 보존되도록)
      - name: Restore pipeline cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-

      - name: Generate posts
        id: pipe
        if: ${{ github.event_name != 'push' && !inputs.fb_test && !inputs.reel_preview }}
        run: node scripts/run-pipeline.mjs
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN || '3' }}
          MAX_PER_DAY: ${{ inputs.max_per_day || vars.MAX_PER_DAY || '40' }}
          KR_SHARE: ${{ vars.KR_SHARE }}
          KR_ONLY: ${{ inputs.kr_only }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS }}
          USE_SOURCE_IMAGES: ${{ vars.USE_SOURCE_IMAGES }}
          PREMIUM_TRAFFIC: ${{ vars.PREMIUM_TRAFFIC }}

      # 오래된 글 단계적 보관 (Cloudflare 파일 한도/저장소 용량 관리). scripts/archive.mjs 참고
      - name: Archive old posts
        id: archive
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: node scripts/archive.mjs
        env:
          LIVE_FULL: ${{ vars.LIVE_FULL || '2500' }}
          LIVE_LITE: ${{ vars.LIVE_LITE || '4500' }}

      # 편집자 노트: 텔레그램 영상 메시지에 답장한 코멘트를 해당 글에 반영
      - name: Apply editor notes from Telegram
        id: notes
        if: ${{ !cancelled() && github.event_name != 'push' && env.TELEGRAM_BOT_TOKEN != '' }}
        run: node scripts/editor-notes.mjs
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NOTES_MODEL: ${{ vars.NOTES_MODEL }}

      - name: Commit new posts
        id: commit
        if: ${{ !cancelled() && (steps.pipe.outputs.published > 0 || steps.notes.outputs.changed > 0 || steps.archive.outputs.changed > 0) }}
        run: |
          git config user.name "thaibuzz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/thumbs
          git diff --cached --quiet && exit 0
          git commit -m "content: ${{ steps.pipe.outputs.published || 0 }} new posts, ${{ steps.notes.outputs.changed || 0 }} editor notes"
          # 동시에 다른 커밋(웹에서 글 수정 등)이 들어오면 몇 번 다시 시도. 충돌이면 중단 → 배포/게시 건너뜀
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      # 예약 실행에서 새 글이 0건이어도, 마지막 배포 이후 코드가 바뀌었으면 배포 (대기열에서 밀려 취소된 push 실행 보완)
      - name: Detect code change since last deploy
        id: code
        run: |
          # 코드뿐 아니라 글(content)도 포함 → GitHub 웹에서 글을 고치거나 지워도 다음 실행에서 배포됨
          HASH=$(git ls-tree -r HEAD | grep -vE $'\tpublic/thumbs/' | sha1sum | cut -c1-40)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ "$(cat .cache/deployed-code-hash 2>/dev/null)" != "$HASH" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # 커밋이 실패했으면 배포/게시하지 않음 (배포만 되고 저장소엔 없는 글 → 다음 배포에서 사라져 페북 링크 404)
      - name: Build
        id: build
        if: ${{ !cancelled() && !inputs.reel_preview && steps.commit.outcome != 'failure' && (steps.pipe.outputs.published > 0 || github.event_name != 'schedule' || steps.code.outputs.changed == 'true') }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CF_PROJECT || 'thaibuzz' }} --branch=main --commit-dirty=true

      - name: Remember deployed code
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: mkdir -p .cache && echo "${{ steps.code.outputs.hash }}" > .cache/deployed-code-hash

      - name: Ping IndexNow (Bing/Yandex/Naver/Seznam)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.pipe.outputs.published > 0 && env.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow.mjs

      # 테스트 실행(fb_test): 가장 최근 글 1개를 게시 대상으로 지정
      - name: Pick latest post for Facebook test
        if: ${{ inputs.fb_test }}
        run: |
          mkdir -p .cache
          node -e "const fs=require('fs');const p=fs.readdirSync('content/posts').filter(f=>f.endsWith('.json')&&!f.startsWith('demo')).map(f=>JSON.parse(fs.readFileSync('content/posts/'+f))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];fs.writeFileSync('.cache/new-urls.txt','/post/'+p.slug+'/');console.log('test target:',p.slug)"

      # 배포가 끝난 뒤에 올려야 링크/이미지가 정상 표시됨
      # 새 글이 없어도 실행: 스크립트가 지난 24시간 안에 게시 실패한 글을 찾아 재시도 (없으면 바로 종료)
      - name: Post to Facebook Page
        if: ${{ !cancelled() && env.FB_PAGE_TOKEN != '' && !inputs.reel_preview && steps.commit.outcome != 'failure' && steps.deploy.outcome != 'failure' }}
        run: node scripts/facebook.mjs
        env:
          META_USAGE_LIMIT: ${{ vars.META_USAGE_LIMIT }}

      # 새 글 → Threads 이미지 게시물 (THREADS_TOKEN 시크릿이 있을 때만). 끄려면 Variables 에 THREADS=false
      - name: Post to Threads
        if: ${{ !cancelled() && env.THREADS_TOKEN != '' && vars.THREADS != 'false' && !inputs.reel_preview && steps.commit.outcome != 'failure' && steps.deploy.outcome != 'failure' }}
        run: node scripts/threads.mjs

      # 새 글 → 세로 숏폼 영상 → Facebook Reels (영상은 저장소에 안 쌓고 올린 뒤 삭제). 끄려면 Variables 에 REELS=false
      - name: Post Reels
        if: ${{ !cancelled() && env.FB_PAGE_TOKEN != '' && vars.REELS != 'false' && !inputs.reel_preview && steps.commit.outcome != 'failure' && steps.deploy.outcome != 'failure' }}
        run: node scripts/reels.mjs
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          REELS_VOICE: ${{ vars.REELS_VOICE }}
          REELS_VOICE_SPEED: ${{ vars.REELS_VOICE_SPEED }}
          IG_REELS: ${{ vars.IG_REELS }}
          TELEGRAM: ${{ vars.TELEGRAM }}
          META_USAGE_LIMIT: ${{ vars.META_USAGE_LIMIT }}
          # TikTok 반자동: 영상을 내 텔레그램으로 전송
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # YouTube Shorts: API 검수 승인 후 Variables 에 YT_UPLOAD=true
          YT_UPLOAD: ${{ vars.YT_UPLOAD }}
          YT_DAILY_MAX: ${{ vars.YT_DAILY_MAX }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      # 미리보기: 가장 최근 글로 영상만 만들어 Actions 실행 화면의 Artifacts 에서 다운로드 (게시 안 함)
      - name: Render reel preview
        if: ${{ inputs.reel_preview }}
        run: |
          mkdir -p .cache
          node -e "const fs=require('fs');const p=fs.readdirSync('content/posts').filter(f=>f.endsWith('.json')&&!f.startsWith('demo')).map(f=>JSON.parse(fs.readFileSync('content/posts/'+f))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];fs.writeFileSync('.cache/new-urls.txt','/post/'+p.slug+'/');console.log('preview target:',p.slug)"
          node scripts/reels.mjs --dry
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          REELS_VOICE: ${{ vars.REELS_VOICE }}
          REELS_VOICE_SPEED: ${{ vars.REELS_VOICE_SPEED }}

      - name: Upload reel preview
        if: ${{ inputs.reel_preview }}
        uses: actions/upload-artifact@v7
        with:
          name: reel-preview
          path: .cache/reels/*.mp4
          retention-days: 3

      # 실패한 실행이어도 거절 목록·모델 쿨다운·배포 해시를 보존 (안 그러면 매시간 같은 실패에 무료 한도를 다시 씀)
      - name: Save pipeline cache
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
