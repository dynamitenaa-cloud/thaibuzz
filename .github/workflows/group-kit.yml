name: group-kit

# 하루 한 번: 페북 그룹에 올릴 글 + 그룹용 캡션 3종을 텔레그램으로 전송 (사람이 복사해서 올림, 비용 없음)
on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC = 18:00 방콕 (퇴근 후 태국 SNS 피크 전)
  workflow_dispatch:
    inputs:
      posts:
        description: '추천 글 개수'
        type: string
        default: '3'
      force:
        description: '보낸 기록을 무시하고 다시 고르기 (이미 보냈는데 아직 못 올렸을 때)'
        type: boolean
        default: false
      dry:
        description: '전송 없이 캡션만 로그로 확인'
        type: boolean
        default: false

concurrency: { group: group-kit, cancel-in-progress: false }

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache/restore@v6
        with:
          path: .cache/group-kit.json
          key: group-kit-${{ github.run_id }}
          restore-keys: group-kit-
      - run: node scripts/group-kit.mjs ${{ inputs.dry && '--dry' || '' }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FACEBOOK_URL: ${{ vars.FACEBOOK_URL }}
          GROUP_KIT_POSTS: ${{ inputs.posts || '3' }}
          GROUP_KIT_FORCE: ${{ inputs.force }}
      - uses: actions/cache/save@v6
        if: ${{ always() }}
        with:
          path: .cache/group-kit.json
          key: group-kit-${{ github.run_id }}
